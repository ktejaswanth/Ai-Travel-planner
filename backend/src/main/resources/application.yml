server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tripwise-backend
  main:
    allow-bean-definition-overriding: true
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/tripwise_db}
      auto-index-creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours in milliseconds

tripwise:
  integrations:
    google:
      maps-api-key: ${GOOGLE_MAPS_API_KEY:}
      places-api-key: ${GOOGLE_PLACES_API_KEY:${GOOGLE_MAPS_API_KEY:}}
    weather:
      open-weather-api-key: ${OPENWEATHER_API_KEY:}
    amadeus:
      client-id: ${AMADEUS_CLIENT_ID:}
      client-secret: ${AMADEUS_CLIENT_SECRET:}
      auth-url: ${AMADEUS_AUTH_URL:https://test.api.amadeus.com/v1/security/oauth2/token}
      base-url: ${AMADEUS_BASE_URL:https://test.api.amadeus.com}
    aviationstack:
      api-key: ${AVIATIONSTACK_API_KEY:}
      base-url: ${AVIATIONSTACK_BASE_URL:http://api.aviationstack.com/v1}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-1.5-flash}

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.2

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.tripwise: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.security: INFO
